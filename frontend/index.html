<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Salary Budget Tracker</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/jpeg" href="/app_logo.jpg" />
  <link rel="apple-touch-icon" href="/app_logo.jpg" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Smart daily salary and expense manager. Works 100% offline." />

  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: var(--font-sans);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Sleek Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Style resets for native date pickers */
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-position: right 10px center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          reg.update();
        }).catch(console.error);
      });
    }
  </script>
</body>
</html>
