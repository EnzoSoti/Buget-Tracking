<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salary Budget Tracker</title>
  
  <!-- PWA & Mobile Settings (No external CDNs - 100% Offline) -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Simple Salary Budget Tracker - 100% Offline App">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="app_logo.jpg">
  <link rel="apple-touch-icon" href="app_logo.jpg">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Simple Clean Header -->
    <header class="app-header">
      <div class="brand">
        <span class="app-icon-emoji">💰</span>
        <div>
          <h1>Salary Budget Tracker</h1>
          <p class="subtitle">100% Offline Budget Manager</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="download-app-btn" class="btn btn-sm btn-primary" title="Download App File for Phone">
          📥 Download App
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle Light/Dark Theme">🌙</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Salary Section -->
      <section class="card">
        <div class="card-title">💵 Salary Income</div>
        <div class="salary-input-row">
          <span class="peso-sign">₱</span>
          <input 
            type="number" 
            id="salary-input" 
            placeholder="Enter salary (e.g. 11153.80)" 
            step="0.01" 
            min="0" 
            value="11153.80"
          >
          <button id="update-salary-btn" class="btn btn-success">Save</button>
        </div>
      </section>

      <!-- Remaining Balance Overview Card -->
      <section class="card balance-card">
        <div class="balance-grid">
          <div class="bal-box">
            <span class="bal-label">Total Salary</span>
            <div class="bal-value" id="disp-total-salary">₱11,153.80</div>
          </div>

          <div class="bal-box">
            <span class="bal-label">Total Expenses</span>
            <div class="bal-value text-danger" id="disp-total-expenses">₱0.00</div>
          </div>
        </div>

        <div class="remaining-box" id="remaining-box">
          <span class="bal-label">REMAINING BALANCE</span>
          <div class="remaining-value" id="disp-remaining-balance">₱11,153.80</div>
        </div>

        <!-- Simple Progress Bar -->
        <div class="progress-section">
          <div class="progress-info">
            <span>Spent: <strong id="spent-percentage">0%</strong></span>
            <span id="budget-status-text" class="text-success">Healthy</span>
          </div>
          <div class="progress-bg">
            <div class="progress-fill" id="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Add Expense Card -->
      <section class="card">
        <div class="card-title">➕ Add Expense</div>

        <!-- Quick Preset Chips -->
        <div class="presets-row">
          <span class="presets-title">Quick Add:</span>
          <button class="chip" data-name="Rice & Groceries" data-cat="Food">🍚 Rice</button>
          <button class="chip" data-name="Electricity Bill" data-cat="Bills">⚡ Electricity</button>
          <button class="chip" data-name="Water Bill" data-cat="Bills">💧 Water</button>
          <button class="chip" data-name="Internet" data-cat="Bills">🌐 Internet</button>
          <button class="chip" data-name="Transpo" data-cat="Transport">🚌 Transpo</button>
          <button class="chip" data-name="Rent" data-cat="Housing">🏠 Rent</button>
        </div>

        <form id="expense-form" class="simple-form">
          <div class="form-group">
            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="e.g. Rice, Electric Bill..." required>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="expense-amount">Amount (₱)</label>
              <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0.01" required>
            </div>

            <div class="form-group flex-1">
              <label for="expense-category">Category</label>
              <select id="expense-category">
                <option value="Food">🍚 Food & Groceries</option>
                <option value="Bills">⚡ Bills & Utilities</option>
                <option value="Transport">🚌 Transportation</option>
                <option value="Housing">🏠 Rent & Housing</option>
                <option value="Health">🏥 Health & Medical</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Entertainment">🎮 Entertainment</option>
                <option value="Others">💡 Others</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">➕ Add Expense</button>
        </form>
      </section>

      <!-- Expenses List Card -->
      <section class="card">
        <div class="card-header-flex">
          <div class="card-title">📝 Expense List</div>
          <select id="category-filter" class="select-filter">
            <option value="ALL">All Categories</option>
            <option value="Food">🍚 Food</option>
            <option value="Bills">⚡ Bills</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Housing">🏠 Housing</option>
            <option value="Health">🏥 Health</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Entertainment">🎮 Entertainment</option>
            <option value="Others">💡 Others</option>
          </select>
        </div>

        <div id="expense-list" class="expense-list">
          <!-- Dynamically populated -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <p>No expenses added yet.</p>
        </div>

        <div class="card-footer-actions">
          <button id="export-btn" class="btn btn-secondary btn-sm">📄 Export CSV</button>
          <button id="clear-all-btn" class="btn btn-danger btn-sm">🗑️ Clear All</button>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <p>Simple Salary Budget Tracker &bull; 100% Offline</p>
    </footer>
  </div>

  <!-- Edit Expense Modal -->
  <div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>✏️ Edit Expense</h3>
        <button id="close-modal-btn" class="close-x">&times;</button>
      </div>
      <form id="edit-expense-form">
        <input type="hidden" id="edit-expense-id">
        <div class="form-group">
          <label for="edit-expense-name">Expense Name</label>
          <input type="text" id="edit-expense-name" required>
        </div>
        <div class="form-group">
          <label for="edit-expense-amount">Amount (₱)</label>
          <input type="number" id="edit-expense-amount" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
          <label for="edit-expense-category">Category</label>
          <select id="edit-expense-category">
            <option value="Food">🍚 Food & Groceries</option>
            <option value="Bills">⚡ Bills & Utilities</option>
            <option value="Transport">🚌 Transportation</option>
            <option value="Housing">🏠 Rent & Housing</option>
            <option value="Health">🏥 Health & Medical</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Entertainment">🎮 Entertainment</option>
            <option value="Others">💡 Others</option>
          </select>
        </div>
        <div class="modal-buttons">
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
