  <script>

        console.warn('Asset 404 detected. Purging caches & reloading for latest update...');
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });

  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {

    html, body, #root {

      margin: 0;
      padding: 0;
      background-color: #090d16;
      font-family: var(--font-sans);

    /* Global Input & Date Picker Styles */
    input, textarea, select {
      outline: none !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease !important;

    /* Modern FinTech Date Input Styling */
    .modern-date-input {
      font-family: var(--font-sans);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;

      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);

    .modern-date-input:focus {

      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
    }

    /* Style resets for native date pickers */
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    /* Animated Progress Bar Fill */
    .progress-bar-animated {

    /* FinTech Monospace Currency Utility */
    .fintech-mono {
      font-family: var(--font-mono), monospace !important;
      font-feature-settings: "tnum" on, "lnum" on !important;

    /* Responsive Grid Layout */
    .responsive-row {

      gap: 16px;

      width: 100%;

        align-items: flex-start !important;
        gap: 20px !important;
      }
      .responsive-col {

      scrollbar-width: none;
      -ms-overflow-style: none;

    .radix-dialog-overlay {

    @media (max-width: 520px) {

    @keyframes radixOverlayShow {

    @media print {
