  <!-- Auto-healing listener for stale Vite bundle hashes -->
  <script>
    window.addEventListener('error', function (e) {

        console.warn('Asset 404 detected. Purging caches & reloading for latest update...');
        if ('caches' in window) {
          caches.keys().then(function(names) {
