  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: var(--font-sans);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Sleek Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Global Input & Date Picker Styles to prevent React Native Web processor conflicts */
    input, textarea, select {
      outline: none !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease !important;
    }

    /* Modern Date Input Styling */
    .modern-date-input {
      font-family: var(--font-sans);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      height: 48px;
      box-sizing: border-box;
      cursor: pointer;
      width: 100%;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #f8fafc;
    }

    /* Light Theme Overrides */
    .light-theme-picker {
      background-color: #ffffff !important;
      color: #111827 !important;
      border-color: #e5e7eb !important;
    }

    .light-theme-picker:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
    }

    .modern-date-input:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
    }

    /* Style resets for native date pickers */
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    /* Animated Progress Bar Fill */
    .progress-bar-animated {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Responsive Split Columns for Sideways Layout & Card Separation */
    .responsive-row {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .responsive-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      width: 100%;
      min-width: 0;
    }

    @media (min-width: 800px) {
      .responsive-row {
        flex-direction: row !important;
        align-items: flex-start !important;
      }
    }
